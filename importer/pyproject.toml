[project]
name = "stepzero-importer"
version = "0.1.0"
description = "StepZero data importer: open data -> station graphs"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "gtfs-kit",
    "networkx",
    "shapely",
    "pandas",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "jupyter",
    "ruff",
    "pytest",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["importer"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]  # exploration notebooks; logic lives in tested modules

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
