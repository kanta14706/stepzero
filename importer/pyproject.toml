[project]
name = "stepzero-importer"
version = "0.1.0"
description = "StepZero data importer: open data -> station graphs"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "gtfs-kit",
    "networkx",
    "shapely",
    "pandas",
]

[dependency-groups]
dev = [
    "jupyter",
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["importer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
